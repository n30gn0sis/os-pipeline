---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
  - id: removelive
    module: shellprocess
    config: shellprocess_removelive.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - packages
      - shellprocess@removelive
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: default
prompt-install: true
dont-chroot: false
